[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-wire"
version = "1.0.0"
description = "An iPhone USB service bridge over Tailscale"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
wireless-wire = "wireless_wire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
